# OneRing lab config — Mihomo (clash-onering) — JhopanStore
# VLESS + WS + TLS, SNI override via onering:REAL:BUG
mixed-port: 7891
external-controller: 127.0.0.1:9095
external-ui: ui
secret: ""
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  # FASE 1 bootstrap: resolve bug domain TANPA proxy
  proxy-server-nameserver:
    - system://
    - 8.8.8.8
    - 1.1.1.1
  # FASE 2 browsing
  nameserver:
    - 8.8.8.8
    - 1.1.1.1

proxies:
  - name: "onering-neva"
    type: vless
    server: support.zoom.us          # bug domain — TCP dial target (yang dilihat ISP)
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000   # ganti UUID asli untuk tes end-to-end
    network: ws
    tls: true
    servername: "onering:neva.jhopanstore.my.id:support.zoom.us"   # OneRing format
    ws-opts:
      path: /vless
      headers:
        Host: neva.jhopanstore.my.id   # real domain
    client-fingerprint: chrome

proxy-groups:
  - name: PROXY
    type: select
    proxies: [onering-neva]

rules:
  - MATCH,PROXY
